# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - Shining-Stars-CRM-App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present
        env:
          # The /backend/* proxy rewrite is resolved at BUILD time and baked into the
          # build output - the Azure app setting cannot change it at runtime. It must
          # be present here, where `next build` runs.
          NEXT_PUBLIC_API_URL: https://ssp-api-hch7ewesbmecehde.westus3-01.azurewebsites.net

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          # Ship source + the .next build but NOT node_modules: the zip round-trip
          # through artifact storage destroys the .bin symlinks ("next: not found"),
          # and Oryx on the App Service runs a clean npm install server-side anyway.
          path: |
            .
            !node_modules
          # Next.js builds into .next/, which upload-artifact v4 EXCLUDES by default
          # as a hidden directory - without this the deployed app has no build and 503s.
          include-hidden-files: true

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_EDA1AF2D0FD44EC1B105694D419EF2AE }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A6A114750D7C4D748C2FA8A0C9F6241A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_1F88EE6F4E9343169A2681C7C2F14118 }}

      - name: 'Deploy to Azure Web App'
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Shining-Stars-CRM-App'
          slot-name: 'Production'
          package: .
          